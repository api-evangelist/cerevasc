aid: cerevasc
name: CereVasc
description: 'CereVasc, Inc. is a clinical-stage medical device company developing
  novel, minimally invasive treatments for patients with neurological diseases. Its
  lead product, the eShunt System, uses percutaneous transvenous-transdural access
  to the central nervous system to treat communicating hydrocephalus — including normal
  pressure hydrocephalus (NPH) — as a less invasive alternative to conventional
  neurosurgical shunt placement. The eShunt System is an investigational device
  limited by United States federal law to investigational use, and is being evaluated
  in the STRIDE pivotal study (NCT06498960). CereVasc raised a $70M Series B in 2024
  and has received FDA Breakthrough Device Designation. The company builds implantable
  hardware and publishes no public API, developer program, or machine-readable
  specification.'
